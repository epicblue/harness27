[network]
interface = eth0
mtu = 1500

[service_metrics]
name = prometheus_exporter
port = 9090
enabled = true

[database_cluster]
host = 127.0.0.1
port = 5432
name = postgres

[service_web]
name = frontend_portal
port = 8000
enabled = true

[cache]
host = 127.0.0.1
port = 6379

[service_api]
name = backend_core
port = 8080
enabled = true

[service_search]
name = opensearch
port = 9200
enabled = false
